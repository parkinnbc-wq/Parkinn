<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เกมการละเล่นแบบไทย</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div id="menu">

<h1>🇹🇭 เกมการละเล่นไทย</h1>

<p>เลือกทีมของคุณ</p>

<div class="characters">

<button onclick="selectTeam('ทีมช้าง')" class="teamBtn">
    <img src="images/Chang.png" alt="ทีมช้าง">
    <br>
    ทีมช้าง
</button>

<button onclick="selectTeam('ทีมไก่')" class="teamBtn">
    <img src="images/Kai.png" alt="ทีมไก่">
    <br>
    ทีมไก่
</button>

<button onclick="selectTeam('ทีมกระต่าย')" class="teamBtn">
    <img src="images/Krataitt.png" alt="ทีมกระต่าย">
    <br>
    ทีมกระต่าย
</button>
</div>

<br>

<button onclick="startGame()">
🎮 เริ่มเล่น
</button>

</div>
</div>

<div id="quiz" style="display:none;">

<div class="topbar">
    <span id="number">ข้อ 1 / 10</span>
    <span id="score">⭐ 0 คะแนน</span>
</div>

<h2 id="question"></h2>

<img id="questionImage" src="" alt="รูปภาพ">

<div id="answers"></div>

</div>

<div id="result" style="display:none;">

<h1>🎉 สรุปผลคะแนน 🎉</h1>

<h2 id="finalScore"></h2>

<p>ขอบคุณที่ร่วมเล่นแบบทดสอบการละเล่นไทย</p>

<button onclick="location.reload()">
🔄 เล่นอีกครั้ง
</button>

</div>

<audio id="clickSound" src="click.mp3"></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>
<audio id="finishSound" src="finish.mp3"></audio>
    
<script src="questions.js"></script>
<script src="script.js"></script>

</body>
</html>
